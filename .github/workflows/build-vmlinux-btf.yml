name: Build vmlinux (BTF)

# =============================================================================
# Reference implementation:
#   https://github.com/QiuSimons/vmlinux-btf/blob/master/Makefile
#
# The upstream Makefile is an OpenWrt package that builds a BTF-enabled vmlinux
# in a "shadow kernel" tree, using the target kernel's .config as the baseline.
# This workflow does the same, but takes everything from the official OpenWrt
# SDK of each target, so no full OpenWrt buildroot (and no toolchain build) is
# needed:
#
#   1. Download the SDK published for the target/subtarget
#   2. Take from the SDK: the kernel version, the exact kernel .config OpenWrt
#      ships for that target, and the matching cross toolchain
#   3. Download the matching upstream kernel source
#   4. Apply the upstream BTF / BPF option set on top of that .config
#   5. make olddefconfig && make vmlinux (with DWARF debug info)
#   6. pahole --btf_encode_detached to extract the BTF data out of vmlinux
#
# The compiler itself also comes from OpenWrt: the gcc/binutils of the SDK
# toolchain is put on PATH and used as CROSS_COMPILE, so the kernel is built
# with the same GCC that OpenWrt uses for that target. Host tools still come
# from the runner (OpenWrt does the same, its host tools are built with the
# system compiler).
#
# The SDK does not carry the kernel source tree (it is stripped down to
# headers, Module.symvers and the prebuilt modules) and OpenWrt leaves the
# target specific patches out of it, so the kernel is compiled from the
# upstream release sources. This matches upstream's shadow kernel, which does
# not apply any patch either.
#
# Targets built here, named by their OpenWrt architecture (arch_packages):
#   x86_64             -> x86/64
#   aarch64_generic    -> armsr/armv8
#   aarch64_cortex-a53 -> mediatek/filogic
#   aarch64_cortex-a72 -> bcm27xx/bcm2711
#   aarch64_cortex-a76 -> bcm27xx/bcm2712
#
# Several targets share the same arch_packages, so the list below picks one
# representative target/subtarget per architecture. If a device needs a
# different kernel .config, swap in another target/subtarget that reports the
# same arch_packages (check profiles.json of that target).
#
# Naming of the archive and the uploaded artifact:
#   <openwrt_version>-vmlinux-<openwrt_arch>-<kernel_version>
#   e.g. 25.12.5-vmlinux-aarch64_cortex-a53-6.12.94.tar.xz
# Each archive holds a single file named "vmlinux".
#
# All architectures sharing the same kernel version are published together in
# one GitHub Release with the gh CLI, tagged:
#   openwrt-<openwrt_version>-<kernel_version>
#   e.g. openwrt-25.12.5-6.12.94
# The tag is checked first and only created when it does not exist yet;
# existing assets are overwritten on re-runs.
#
# Note: the five kernel builds run in parallel, each one taking 1-3 hours.
# Trim the target list below if your plan limits concurrent jobs or minutes.
#
# Usage: Actions -> Build vmlinux (BTF) -> Run workflow -> enter an OpenWrt version
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt release version (e.g. 25.12.5 / 24.10.8)"
        required: true
        default: "25.12.5"
      artifact:
        description: "Which build output to package as vmlinux"
        required: true
        type: choice
        default: btf
        options:
          # Detached BTF data extracted by pahole - identical to what the
          # upstream Makefile installs, only a few MB in size
          - btf
          # The compiled vmlinux ELF itself (DWARF debug info + embedded BTF),
          # very large
          - vmlinux

permissions:
  contents: read

concurrency:
  group: build-vmlinux
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve the SDK, the kernel version and the build matrix
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve OpenWrt SDKs
    runs-on: ubuntu-24.04
    outputs:
      openwrt_version: ${{ steps.resolve.outputs.openwrt_version }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve SDK, kernel version and matrix
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.openwrt_version }}
        run: |
          set -euo pipefail

          OPENWRT_VERSION="$(echo "${INPUT_VERSION}" | tr -d '[:space:]')"
          OPENWRT_VERSION="${OPENWRT_VERSION#v}"

          if ! [[ "${OPENWRT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Malformed OpenWrt version '${INPUT_VERSION}' - expected a release version such as 25.12.5 or 24.10.8"
            exit 1
          fi

          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}"
          if ! curl -fsIL --http1.1 --connect-timeout 20 --max-time 60 "${BASE}/" >/dev/null; then
            echo "::error::OpenWrt ${OPENWRT_VERSION} is not available at downloads.openwrt.org"
            exit 1
          fi

          : > /tmp/matrix.jsonl
          {
            echo "### OpenWrt ${OPENWRT_VERSION}"
            echo ""
            echo "| OpenWrt arch | target/subtarget | kernel | SDK |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # The expected arch_packages is verified against profiles.json, so a
          # wrong target/subtarget pairing fails here instead of silently
          # producing a vmlinux for the wrong architecture.
          while IFS='|' read -r openwrt_arch target subtarget kernel_arch; do
            case "${openwrt_arch}" in
              "" | "#"*) continue ;;
            esac

            url="${BASE}/targets/${target}/${subtarget}"

            profiles="$(curl -fsSL --http1.1 --retry 3 --max-time 60 "${url}/profiles.json")"
            got_arch="$(echo "${profiles}" | jq -r '.arch_packages')"
            kernel_version="$(echo "${profiles}" | jq -r '.linux_kernel.version // empty')"

            if [ "${got_arch}" != "${openwrt_arch}" ]; then
              echo "::error::${target}/${subtarget} reports arch_packages=${got_arch}, expected ${openwrt_arch}"
              exit 1
            fi
            if [ -z "${kernel_version}" ]; then
              echo "::error::${target}/${subtarget} does not report a kernel version in profiles.json"
              exit 1
            fi

            index="$(curl -fsSL --http1.1 --retry 3 --max-time 60 "${url}/")"
            sdk_name="$(echo "${index}" | grep -oE 'openwrt-sdk-[^"<>]*\.tar\.(zst|xz)' | head -n1)"
            if [ -z "${sdk_name}" ]; then
              echo "::error::OpenWrt ${OPENWRT_VERSION} publishes no SDK for ${target}/${subtarget}"
              exit 1
            fi

            dist_name="${OPENWRT_VERSION}-vmlinux-${openwrt_arch}-${kernel_version}"

            jq -nc \
              --arg openwrt_arch "${openwrt_arch}" \
              --arg target "${target}" \
              --arg subtarget "${subtarget}" \
              --arg kernel_arch "${kernel_arch}" \
              --arg kernel_version "${kernel_version}" \
              --arg sdk_url "${url}/${sdk_name}" \
              --arg sdk_name "${sdk_name}" \
              --arg dist_name "${dist_name}" \
              '{openwrt_arch:$openwrt_arch,target:$target,subtarget:$subtarget,kernel_arch:$kernel_arch,kernel_version:$kernel_version,sdk_url:$sdk_url,sdk_name:$sdk_name,dist_name:$dist_name}' \
              >> /tmp/matrix.jsonl

            echo "| ${openwrt_arch} | ${target}/${subtarget} | ${kernel_version} | ${sdk_name} |" >> "$GITHUB_STEP_SUMMARY"
          done <<'TARGETS'
          # openwrt_arch|target|subtarget|kernel_arch
          x86_64|x86|64|x86_64
          aarch64_generic|armsr|armv8|arm64
          aarch64_cortex-a53|mediatek|filogic|arm64
          aarch64_cortex-a72|bcm27xx|bcm2711|arm64
          aarch64_cortex-a76|bcm27xx|bcm2712|arm64
          TARGETS

          echo "Resolved $(wc -l < /tmp/matrix.jsonl) targets"

          {
            echo "openwrt_version=${OPENWRT_VERSION}"
            echo "matrix=$(jq -sc . /tmp/matrix.jsonl)"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Build one BTF-enabled vmlinux per OpenWrt architecture
  # ---------------------------------------------------------------------------
  build:
    name: Build vmlinux (${{ matrix.openwrt_arch }})
    needs: prepare
    runs-on: ubuntu-24.04
    # A full kernel build with DWARF is slow; allow close to the GitHub job limit
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      OPENWRT_VERSION: ${{ needs.prepare.outputs.openwrt_version }}
      OPENWRT_ARCH: ${{ matrix.openwrt_arch }}
      KERNEL_ARCH: ${{ matrix.kernel_arch }}
      KERNEL_VERSION: ${{ matrix.kernel_version }}
      SDK_URL: ${{ matrix.sdk_url }}
      SDK_NAME: ${{ matrix.sdk_name }}
      DIST_NAME: ${{ matrix.dist_name }}
      ARTIFACT_KIND: ${{ inputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          set -euo pipefail
          echo "Before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/boost
          sudo docker image prune -af || true
          echo "After cleanup:"
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev zlib1g-dev \
            python3 rsync cpio kmod dwarves \
            xz-utils zstd tar curl git ca-certificates

      - name: Check pahole version
        run: |
          set -euo pipefail
          PAHOLE_VER="$(pahole --version | tr -d 'v' | cut -d. -f1,2)"
          echo "pahole version: ${PAHOLE_VER}"
          if awk -v v="${PAHOLE_VER}" 'BEGIN { exit (v + 0 < 1.16) ? 1 : 0 }'; then
            echo "pahole version check passed"
          else
            echo "::error::pahole is too old (--btf_encode_detached requires >= 1.16), got ${PAHOLE_VER}"
            exit 1
          fi

      - name: Download and extract the OpenWrt SDK
        run: |
          set -euo pipefail

          echo "SDK: ${SDK_NAME}"
          mkdir -p "${RUNNER_TEMP}/sdk-dl" "${RUNNER_TEMP}/sdk"
          curl -fL --http1.1 --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/sdk-dl/${SDK_NAME}" "${SDK_URL}"

          case "${SDK_NAME}" in
            *.tar.zst) opts=(--zstd) ;;
            *.tar.xz)  opts=(-J) ;;
            *)         opts=() ;;
          esac
          tar "${opts[@]}" -C "${RUNNER_TEMP}/sdk" -xf "${RUNNER_TEMP}/sdk-dl/${SDK_NAME}"
          rm -rf "${RUNNER_TEMP}/sdk-dl"

          SDK_DIR="$(find "${RUNNER_TEMP}/sdk" -mindepth 1 -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)"
          if [ -z "${SDK_DIR}" ]; then
            echo "::error::Unexpected SDK layout, no openwrt-sdk-* directory found"
            exit 1
          fi
          echo "SDK directory: ${SDK_DIR}"

          # The SDK ships the exact kernel .config of this target/subtarget
          kernel_dir="$(find "${SDK_DIR}/build_dir" -maxdepth 4 -type d -path '*linux-*/linux-*' | head -n1)"
          if [ -z "${kernel_dir}" ] || [ ! -f "${kernel_dir}/.config" ]; then
            echo "::error::The SDK does not provide the kernel .config (expected build_dir/*/linux-*/linux-*/.config)"
            exit 1
          fi

          sdk_kernel_version="${kernel_dir##*/linux-}"
          echo "Kernel version in the SDK: ${sdk_kernel_version} (profiles.json reported ${KERNEL_VERSION})"
          if [ "${sdk_kernel_version}" != "${KERNEL_VERSION}" ]; then
            echo "::warning::OpenWrt reports ${KERNEL_VERSION} but the SDK ships ${sdk_kernel_version}"
          fi

          cross_gcc="$(find "${SDK_DIR}"/staging_dir/toolchain-*/bin -maxdepth 1 -name '*-openwrt-linux-musl-gcc' | head -n1)"
          if [ -z "${cross_gcc}" ]; then
            echo "::error::The SDK does not provide a cross toolchain"
            exit 1
          fi
          toolchain_bin="$(dirname "${cross_gcc}")"
          # Absolute prefix, so the kernel build finds the OpenWrt gcc even if
          # PATH is not set up as expected
          cross_prefix="${toolchain_bin}/$(basename "${cross_gcc}" | sed 's/gcc$//')"
          echo "OpenWrt toolchain: ${cross_prefix}"

          # The OpenWrt toolchain looks up its sysroot through $STAGING_DIR and
          # warns "environment variable 'STAGING_DIR' not defined" without it.
          # The buildroot exports STAGING_DIR and STAGING_DIR_HOST (see rules.mk),
          # where STAGING_DIR is staging_dir/target-<arch>_<libc>, not staging_dir
          # itself. Looking it up by glob keeps this identical for x86_64 and for
          # every aarch64 variant.
          staging_dir="$(find "${SDK_DIR}/staging_dir" -mindepth 1 -maxdepth 1 -type d -name 'target-*' | head -n1)"
          if [ -z "${staging_dir}" ]; then
            echo "::error::The SDK does not provide a staging_dir/target-* directory"
            exit 1
          fi
          echo "STAGING_DIR: ${staging_dir}"

          {
            echo "SDK_DIR=${SDK_DIR}"
            echo "SDK_KERNEL_CONFIG=${kernel_dir}/.config"
            echo "CROSS_COMPILE=${cross_prefix}"
            echo "STAGING_DIR=${staging_dir}"
            echo "STAGING_DIR_HOST=${SDK_DIR}/staging_dir/host"
          } >> "$GITHUB_ENV"

          # Also expose the OpenWrt toolchain on PATH, the same way the OpenWrt
          # buildroot does when it builds the kernel
          echo "${toolchain_bin}" >> "$GITHUB_PATH"

      - name: Verify the OpenWrt toolchain
        run: |
          set -euo pipefail

          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "STAGING_DIR=${STAGING_DIR}"

          # The OpenWrt gcc resolves its sysroot through STAGING_DIR, so an
          # unset or wrong value would silently change what it searches
          if [ ! -d "${STAGING_DIR}" ]; then
            echo "::error::STAGING_DIR '${STAGING_DIR}' does not exist"
            exit 1
          fi

          "${CROSS_COMPILE}gcc" --version | head -n1
          echo "Target triple: $("${CROSS_COMPILE}gcc" -dumpmachine)"

          # Smoke test: cross compile a tiny object, so a broken toolchain fails
          # here instead of hours into the kernel build
          printf 'int openwrt_gcc_smoke_test(void) { return 0; }\n' > "${RUNNER_TEMP}/smoke.c"
          if ! "${CROSS_COMPILE}gcc" -O2 -c "${RUNNER_TEMP}/smoke.c" -o "${RUNNER_TEMP}/smoke.o" 2> "${RUNNER_TEMP}/smoke.err"; then
            echo "::error::The OpenWrt cross compiler failed to compile a trivial file"
            cat "${RUNNER_TEMP}/smoke.err"
            exit 1
          fi
          cat "${RUNNER_TEMP}/smoke.err"

          if grep -q "STAGING_DIR" "${RUNNER_TEMP}/smoke.err"; then
            echo "::error::The OpenWrt toolchain still complains about STAGING_DIR"
            exit 1
          fi

          file "${RUNNER_TEMP}/smoke.o"

          if [ "${KERNEL_ARCH}" = "x86_64" ]; then
            expected="x86-64"
          else
            expected="aarch64"
          fi

          if file "${RUNNER_TEMP}/smoke.o" | grep -q "${expected}"; then
            echo "Smoke test object is ${expected} - the OpenWrt toolchain works"
          else
            echo "::error::The smoke test object is not ${expected}"
            exit 1
          fi

      - name: Download and extract the kernel source
        run: |
          set -euo pipefail

          SERIES="v${KERNEL_VERSION%%.*}.x"
          TARBALL="linux-${KERNEL_VERSION}.tar.xz"
          SRC_DIR="${GITHUB_WORKSPACE}/linux-${KERNEL_VERSION}"
          rm -rf "$SRC_DIR"

          URL=""
          for base in \
            "https://cdn.kernel.org/pub/linux/kernel/${SERIES}" \
            "https://mirrors.edge.kernel.org/pub/linux/kernel/${SERIES}" \
            "https://www.kernel.org/pub/linux/kernel/${SERIES}"
          do
            if curl -fsIL --http1.1 --connect-timeout 20 --max-time 60 --retry 3 "${base}/${TARBALL}" >/dev/null; then
              URL="${base}/${TARBALL}"
              break
            fi
          done

          if [ -n "${URL}" ]; then
            echo "Downloading ${URL}"
            curl -fL --http1.1 --retry 5 --retry-delay 5 --retry-all-errors \
              -o "${RUNNER_TEMP}/${TARBALL}" "${URL}"
            tar -xJf "${RUNNER_TEMP}/${TARBALL}" -C "${GITHUB_WORKSPACE}"
            rm -f "${RUNNER_TEMP}/${TARBALL}"
          else
            echo "No official mirror provides ${TARBALL}, falling back to git.kernel.org tag v${KERNEL_VERSION}"
            for repo in \
              "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git" \
              "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
            do
              if git clone --depth 1 --branch "v${KERNEL_VERSION}" "$repo" "$SRC_DIR"; then
                rm -rf "${SRC_DIR}/.git"
                break
              fi
              rm -rf "$SRC_DIR"
            done
          fi

          if [ ! -f "${SRC_DIR}/Makefile" ]; then
            echo "::error::Could not fetch kernel source for ${KERNEL_VERSION}"
            exit 1
          fi

          echo "SRC_DIR=${SRC_DIR}" >> "$GITHUB_ENV"
          echo "Source directory: ${SRC_DIR}"

      - name: Generate and adjust .config (mirrors the upstream Makefile options)
        run: |
          set -euo pipefail
          cd "${SRC_DIR}"

          # Baseline: the exact kernel .config that the OpenWrt SDK ships for
          # this target/subtarget. Upstream does the same by copying
          # $(LINUX_DIR)/.config, which is far more accurate than a defconfig.
          cp "${SDK_KERNEL_CONFIG}" .config
          echo "Baseline .config taken from ${SDK_KERNEL_CONFIG}"

          # Apply the options used by the upstream Makefile Build/Compile rule.
          # Symbols that come from OpenWrt patches are unknown to the vanilla
          # kernel and get dropped by olddefconfig with a warning.
          while read -r action symbol value; do
            case "$action" in
              "" | "#"*) continue ;;
              set-str)
                value="${value%\"}"
                value="${value#\"}"
                ./scripts/config --file .config --set-str "$symbol" "$value" || true
                ;;
              *)
                ./scripts/config --file .config "--${action}" "$symbol" || true
                ;;
            esac
          done <<'CONFIG_OPTIONS'
          # --- Dependency chain required by the upstream option set ---
          # In kernel/trace/Kconfig, KPROBE_EVENTS / UPROBE_EVENTS / BPF_EVENTS sit
          # inside an "if FTRACE" block, and TRACING (which selects TRACEPOINTS) is
          # only selected by those symbols. OpenWrt disables FTRACE on some
          # targets, and an explicit n wins over "default y if DEBUG_KERNEL", so
          # olddefconfig would silently drop all of those options. FTRACE is
          # therefore enabled explicitly.
          enable FTRACE
          enable TRACING
          # --- Copied from the QiuSimons/vmlinux-btf Makefile ---
          disable WERROR
          enable CGROUPS
          enable CGROUP_BPF
          enable SOCK_CGROUP_DATA
          enable KALLSYMS
          enable PERF_EVENTS
          enable TRACEPOINTS
          enable KPROBES
          enable UPROBES
          enable BPF
          enable BPF_SYSCALL
          enable BPF_JIT
          enable BPF_JIT_DEFAULT_ON
          enable INET
          enable NET_INGRESS
          enable NET_EGRESS
          enable BPF_STREAM_PARSER
          enable XDP_SOCKETS
          enable NET_SCHED
          enable NET_SCH_INGRESS
          enable NET_CLS
          enable NET_CLS_ACT
          enable KPROBE_EVENTS
          enable UPROBE_EVENTS
          enable BPF_EVENTS
          enable DEBUG_KERNEL
          enable DEBUG_INFO
          disable DEBUG_INFO_NONE
          enable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          disable DEBUG_INFO_REDUCED
          disable DEBUG_INFO_SPLIT
          enable DEBUG_INFO_BTF
          set-str EXTRA_FIRMWARE ""
          # The OpenWrt .config points this at its rootfs build directory
          set-str INITRAMFS_SOURCE ""
          # --- Extra options required in CI to avoid signing/certificate errors ---
          set-str SYSTEM_TRUSTED_KEYS ""
          set-str SYSTEM_REVOCATION_KEYS ""
          CONFIG_OPTIONS

          make ARCH="${KERNEL_ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig

          echo "===== Key option verification ====="
          # Required options: fail the step if any of them is missing
          REQUIRED="CGROUPS CGROUP_BPF KALLSYMS PERF_EVENTS KPROBES UPROBES
                    BPF BPF_SYSCALL BPF_JIT INET XDP_SOCKETS
                    KPROBE_EVENTS UPROBE_EVENTS DEBUG_INFO DEBUG_INFO_BTF"
          # Optional options: not offered by every kernel version, warn only
          OPTIONAL="TRACEPOINTS BPF_EVENTS SOCK_CGROUP_DATA NET_SCH_INGRESS NET_CLS NET_CLS_ACT"

          failed=0
          for sym in ${REQUIRED}; do
            if grep -q "^CONFIG_${sym}=y" .config; then
              echo "  [required] CONFIG_${sym}=y"
            else
              echo "::error::CONFIG_${sym} is not enabled, check whether this kernel version supports it"
              failed=1
            fi
          done
          for sym in ${OPTIONAL}; do
            if grep -q "^CONFIG_${sym}=y" .config; then
              echo "  [optional] CONFIG_${sym}=y"
            else
              echo "::warning::CONFIG_${sym} not enabled (this kernel version may not provide it)"
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo "Dependency state, useful to diagnose the missing symbols above:"
            grep -E "^CONFIG_(FTRACE|TRACING|TRACEPOINTS|PROBE_EVENTS|UPROBES|KPROBES|KPROBE_EVENTS|UPROBE_EVENTS|BPF_EVENTS)=" .config || true
            grep -E "^# CONFIG_(FTRACE|TRACING|TRACEPOINTS|UPROBES|KPROBE_EVENTS|UPROBE_EVENTS|BPF_EVENTS) is not set" .config || true
            exit 1
          fi

      - name: Build vmlinux
        run: |
          set -euo pipefail
          cd "${SRC_DIR}"
          echo "Building: ARCH=${KERNEL_ARCH} CROSS_COMPILE=${CROSS_COMPILE} JOBS=$(nproc)"
          make -j"$(nproc)" \
            ARCH="${KERNEL_ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            KBUILD_HOSTLDFLAGS="-lz" \
            vmlinux
          ls -lh ./vmlinux

      - name: Encode BTF and package ${{ matrix.dist_name }}.tar.xz
        run: |
          set -euo pipefail
          cd "${SRC_DIR}"

          OUT_DIR="${RUNNER_TEMP}/pkg"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          # Same as upstream: extract the detached BTF data from vmlinux
          pahole --btf_encode_detached="${OUT_DIR}/vmlinux.btf" ./vmlinux

          # The packaged file must be named exactly "vmlinux"
          if [ "${ARTIFACT_KIND}" = "vmlinux" ]; then
            cp ./vmlinux "${OUT_DIR}/vmlinux"
          else
            cp "${OUT_DIR}/vmlinux.btf" "${OUT_DIR}/vmlinux"
          fi
          ls -lh "${OUT_DIR}/vmlinux"
          file "${OUT_DIR}/vmlinux" || true

          ARCHIVE="${DIST_NAME}.tar.xz"
          # tar + xz (multi-threaded, otherwise packing a full vmlinux is slow)
          tar -C "${OUT_DIR}" -cf - vmlinux | xz -T0 -6 > "${GITHUB_WORKSPACE}/${ARCHIVE}"

          sha256sum "${GITHUB_WORKSPACE}/${ARCHIVE}" | tee "${GITHUB_WORKSPACE}/${ARCHIVE}.sha256"

          echo "===== Archive contents ====="
          tar -tvJf "${GITHUB_WORKSPACE}/${ARCHIVE}"
          ls -lh "${GITHUB_WORKSPACE}/${ARCHIVE}"

          {
            echo "### ${DIST_NAME}"
            echo ""
            echo '```'
            tar -tvJf "${GITHUB_WORKSPACE}/${ARCHIVE}"
            echo '```'
            echo ""
            echo "- OpenWrt version: \`${OPENWRT_VERSION}\`"
            echo "- OpenWrt arch: \`${OPENWRT_ARCH}\`"
            echo "- Kernel version: \`${KERNEL_VERSION}\`"
            echo "- Artifact kind: \`${ARTIFACT_KIND}\`"
            echo "- pahole: \`$(pahole --version)\`"
            echo "- SHA256: \`$(cut -d' ' -f1 "${GITHUB_WORKSPACE}/${ARCHIVE}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dist_name }}
          path: |
            ${{ matrix.dist_name }}.tar.xz
            ${{ matrix.dist_name }}.tar.xz.sha256
          # Already xz-compressed, no need to compress again
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Publish one GitHub Release per kernel version, collecting the assets of
  #    every architecture that shares it
  #    tag = openwrt-<openwrt_version>-<kernel_version>
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub releases
    needs: [prepare, build]
    # Publish only when every architecture was built successfully
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    # Writing to a release needs contents: write (the workflow default is read)
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OPENWRT_VERSION: ${{ needs.prepare.outputs.openwrt_version }}
      MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          # Every architecture of this run; grouped by kernel version below
          pattern: "*-vmlinux-*"
          path: dist
          merge-multiple: true

      - name: Check whether the tag and the release already exist
        run: |
          set -euo pipefail

          state="${RUNNER_TEMP}/release-state.jsonl"
          : > "${state}"

          mapfile -t kernel_versions < <(jq -r '[.[].kernel_version] | unique[]' <<< "${MATRIX_JSON}")
          if [ "${#kernel_versions[@]}" -eq 0 ]; then
            echo "::error::The build matrix does not contain any kernel version"
            exit 1
          fi

          for kernel_version in "${kernel_versions[@]}"; do
            tag="openwrt-${OPENWRT_VERSION}-${kernel_version}"

            release_exists=false
            if gh release view "${tag}" >/dev/null 2>&1; then
              release_exists=true
              echo "Release ${tag} already exists - skipping creation, assets will be overwritten."
            else
              echo "Release ${tag} does not exist - it will be created."
            fi

            tag_exists=false
            if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              tag_exists=true
              echo "Tag ${tag} already exists - it will be reused."
            else
              echo "Tag ${tag} does not exist - gh will create it."
            fi

            jq -nc \
              --arg tag "${tag}" \
              --arg kernel_version "${kernel_version}" \
              --argjson release_exists "${release_exists}" \
              --argjson tag_exists "${tag_exists}" \
              '{tag:$tag,kernel_version:$kernel_version,release_exists:$release_exists,tag_exists:$tag_exists}' \
              >> "${state}"
          done

          echo "Resolved $(wc -l < "${state}") release(s)"

      - name: Create tag and release with gh
        run: |
          set -euo pipefail

          mapfile -t states < "${RUNNER_TEMP}/release-state.jsonl"

          for entry in "${states[@]}"; do
            IFS=$'\t' read -r tag kernel_version release_exists tag_exists \
              <<< "$(jq -r '[.tag, .kernel_version, (.release_exists|tostring), (.tag_exists|tostring)] | @tsv' <<< "${entry}")"

            if [ "${release_exists}" = "true" ]; then
              echo "Release ${tag} already exists - skipping creation."
              continue
            fi

            mapfile -t assets < <(jq -r --arg kv "${kernel_version}" \
              '.[] | select(.kernel_version == $kv) | "- " + .dist_name + ".tar.xz  (OpenWrt arch " + .openwrt_arch + ", " + .target + "/" + .subtarget + ")"' \
              <<< "${MATRIX_JSON}")

            cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          vmlinux with embedded BTF, for CO-RE eBPF programs.

          - OpenWrt version: ${OPENWRT_VERSION}
          - Kernel version: ${kernel_version}

          Assets:

          $(printf '%s\n' "${assets[@]}")

          Every archive contains a single file named vmlinux, plus its .sha256
          checksum.

          Build recipe: the option set of the upstream QiuSimons/vmlinux-btf
          Makefile, applied on top of the kernel .config shipped in the official
          OpenWrt SDK.

          Built by GitHub Actions run #${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA}.
          EOF

            args=(--title "${tag}" --notes-file "${RUNNER_TEMP}/release-notes.md")
            if [ "${tag_exists}" = "false" ]; then
              # Point the newly created tag at the commit this workflow ran on
              args+=(--target "${GITHUB_SHA}")
            fi

            gh release create "${tag}" "${args[@]}"
          done

      - name: Upload archives with gh
        run: |
          set -euo pipefail

          mapfile -t states < "${RUNNER_TEMP}/release-state.jsonl"

          for entry in "${states[@]}"; do
            IFS=$'\t' read -r tag kernel_version \
              <<< "$(jq -r '[.tag, .kernel_version] | @tsv' <<< "${entry}")"

            files=()
            mapfile -t dist_names < <(jq -r --arg kv "${kernel_version}" \
              '.[] | select(.kernel_version == $kv) | .dist_name' <<< "${MATRIX_JSON}")

            for dist_name in "${dist_names[@]}"; do
              if [ -f "dist/${dist_name}.tar.xz" ]; then
                files+=("dist/${dist_name}.tar.xz")
              fi
              if [ -f "dist/${dist_name}.tar.xz.sha256" ]; then
                files+=("dist/${dist_name}.tar.xz.sha256")
              fi
            done

            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::No archives found in dist/ for ${tag}, did the build jobs upload their artifacts?"
              exit 1
            fi

            echo "Uploading to ${tag}:"
            printf '  %s\n' "${files[@]}"
            gh release upload "${tag}" "${files[@]}" --clobber

            # The upload already succeeded, so do not fail the step if the
            # summary lookup goes wrong
            {
              echo "### Release ${tag}"
              echo ""
              echo "- URL: $(gh release view "${tag}" --json url -q .url || true)"
              echo "- Assets:"
              gh release view "${tag}" --json assets -q '.assets[].name' 2>/dev/null \
                | sed 's/^/  - /' || true
            } >> "$GITHUB_STEP_SUMMARY"
          done
